packages:
  - "packages/*"
  - "services/*"

overrides:
  esbuild: 0.28.1
  sharp: 0.35.0
  undici: 7.29.0
  vite: 8.0.16
  ws: 8.21.0

onlyBuiltDependencies:
  - esbuild
  - sharp
  - workerd
allowBuilds:
  '@google/genai': true
  esbuild: true
  protobufjs: true
  sharp: true
  workerd: true
minimumReleaseAgeExclude:
  - '@google/genai@2.17.0'
patchedDependencies:
  image-size@2.0.2: patches/image-size@2.0.2.patch
